<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sign Up - PracticeSmarter</title>

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/login.css">
</head>

<body>

    <div class="login-container">

        <div class="login-card">

            <!-- LEFT SIDE -->
            <div class="login-left">

                <h2>PracticeSmarter.</h2>

                <p>
                    Start your journey.<br>
                    Practice your skills.<br>
                    Crack your interview.
                </p>

                <div class="login-image">
                    <img src="images/login-illustration.png"
                         alt="Interview practice illustration">
                </div>

            </div>


            <!-- RIGHT SIDE -->
            <div class="login-right">

                <h1>Create Account 👋</h1>

                <p class="login-subtitle">
                    Start your AI interview practice journey.
                </p>

                <form onsubmit="signupUser(event)">

                    <label>Full Name</label>

                    <input
                        type="text"
                        placeholder="Enter your full name"
                        required
                    >


                    <label>Email</label>

                    <input
                        type="email"
                        placeholder="Enter your email"
                        required
                    >


                    <label>Password</label>

                    <div class="password-box">

                        <input
                            type="password"
                            id="signup-password"
                            placeholder="Create a password"
                            required
                        >

                        <button
                            type="button"
                            class="toggle-password"
                            onclick="toggleSignupPassword('signup-password')">
                            👁
                        </button>

                    </div>


                    <label>Confirm Password</label>

                    <div class="password-box">

                        <input
                            type="password"
                            id="confirm-password"
                            placeholder="Confirm your password"
                            required
                        >

                        <button
                            type="button"
                            class="toggle-password"
                            onclick="toggleSignupPassword('confirm-password')">
                            👁
                        </button>

                    </div>


                    <button type="submit">
                        Create Account
                    </button>

                </form>


                <p class="signup-text">

                    Already have an account?

                    <a href="login.html">
                        Login
                    </a>

                </p>

            </div>

        </div>

    </div>


    <script>

        function toggleSignupPassword(id) {

            const password = document.getElementById(id);

            if (password.type === "password") {
                password.type = "text";
            } else {
                password.type = "password";
            }

        }

    </script>
    <script type="module" src="js/signup.js"></script>

</body>

</html>
