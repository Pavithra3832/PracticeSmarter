<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Interview History - PracticeSmarter</title>

    <link
        rel="stylesheet"
        href="css/style.css">

    <link
        rel="stylesheet"
        href="css/dashboard.css">

    <style>

        /* =====================================
           INTERVIEW HISTORY
        ===================================== */

        .history-page {

            width: 100%;
            max-width: 1200px;

            margin: 0 auto;

            padding: 42px 30px 70px;

            box-sizing: border-box;

        }


        .history-header {

            margin-bottom: 25px;

        }


        .history-header h1 {

            margin: 0 0 7px;

            color: #111827;

            font-size: 30px;

            font-weight: 750;

        }


        .history-header p {

            margin: 0;

            color: #64748b;

            font-size: 14px;

        }


        /* =====================================
           HISTORY CONTAINER
        ===================================== */

        .history-container {

            width: 100%;

            background: #ffffff;

            border: 1px solid #e5eaf1;

            border-radius: 15px;

            padding: 22px;

            box-sizing: border-box;

            box-shadow:
                0 3px 12px rgba(
                    15,
                    23,
                    42,
                    0.035
                );

        }


        /* =====================================
           FILTERS
        ===================================== */

        .history-filters {

            display: flex;

            gap: 12px;

            margin-bottom: 22px;

            flex-wrap: wrap;

        }


        .history-filters select {

            min-width: 170px;

            padding: 11px 13px;

            border: 1px solid #e5eaf1;

            border-radius: 8px;

            background: #f8fafc;

            color: #334155;

            font-family: inherit;

            font-size: 13px;

            cursor: pointer;

            outline: none;

        }


        .history-filters select:focus {

            border-color: #93c5fd;

            background: #ffffff;

        }


        /* =====================================
           HISTORY CARD
        ===================================== */

        .history-card {

            width: 100%;

            min-height: 82px;

            padding: 17px 19px;

            margin-bottom: 11px;

            display: flex;

            align-items: center;

            justify-content: space-between;

            gap: 20px;

            box-sizing: border-box;

            background: #f8fafc;

            border: 1px solid #e5eaf1;

            border-radius: 11px;

            transition: 0.2s ease;

        }


        .history-card:last-child {

            margin-bottom: 0;

        }


        .history-card:hover {

            background: #ffffff;

            border-color: #bfdbfe;

            transform: translateY(-1px);

        }


        .history-info {

            min-width: 0;

            flex: 1;

        }


        .history-info h3 {

            margin: 0 0 5px;

            color: #111827;

            font-size: 15px;

            font-weight: 700;

        }


        .history-info p {

            margin: 0 0 4px;

            color: #64748b;

            font-size: 12px;

        }


        .history-info small {

            color: #94a3b8;

            font-size: 11px;

        }


        /* =====================================
           SCORE
        ===================================== */

        .history-score {

            flex-shrink: 0;

            min-width: 80px;

            padding: 8px 12px;

            text-align: center;

            box-sizing: border-box;

            background: #eff6ff;

            border: 1px solid #dbeafe;

            border-radius: 8px;

            color: #2563eb;

            font-size: 13px;

            font-weight: 750;

        }


        /* =====================================
           EMPTY STATE
        ===================================== */

        .history-empty {

            padding: 45px 20px;

            text-align: center;

        }


        .history-empty-icon {

            font-size: 35px;

            margin-bottom: 10px;

        }


        .history-empty h3 {

            margin: 0 0 6px;

            color: #111827;

            font-size: 16px;

        }


        .history-empty p {

            margin: 0;

            color: #64748b;

            font-size: 13px;

        }


        /* =====================================
           MOBILE
        ===================================== */

        @media (max-width: 650px) {

            .history-page {

                padding: 28px 16px 45px;

            }


            .history-container {

                padding: 17px;

            }


            .history-header h1 {

                font-size: 25px;

            }


            .history-filters {

                flex-direction: column;

            }


            .history-filters select {

                width: 100%;

            }


            .history-card {

                align-items: flex-start;

                padding: 16px;

            }


            .history-score {

                min-width: 70px;

            }

        }

    </style>

</head>


<body>


<!-- =====================================
     NAVBAR
===================================== -->

<header>

    <nav class="navbar">

        <h2 class="logo">
            PracticeSmarter.
        </h2>


        <ul class="nav-links">

            <li>
                <a href="dashboard.html">
                    Dashboard
                </a>
            </li>

            <li>
                <a href="interview.html">
                    Practice
                </a>
            </li>

            <li>
                <a href="progress.html">
                    Progress
                </a>
            </li>

            <li>
                <a href="profile.html">
                    Profile
                </a>
            </li>

        </ul>


        <div class="navbar-actions">

    <!-- Back to Dashboard -->
    <a
        href="dashboard.html"
        class="icon-button"
        title="Back to Dashboard">

        🏠

    </a>

    <!-- Profile -->
    <div class="profile-menu-wrapper">

        <button
            class="icon-button"
            id="profile-button"
            type="button"
            title="Profile">

            <span
                class="navbar-profile-avatar"
                id="navbar-profile-avatar">
                👤
            </span>

        </button>

        <div
            class="profile-dropdown"
            id="profile-dropdown">

            <a href="profile.html">
                👤 Profile
            </a>

            <a href="progress.html">
                📊 My Progress
            </a>

            <button
                id="logout-button"
                type="button">
                🚪 Logout
            </button>

        </div>

    </div>

</div>

    </nav>

</header>


<!-- =====================================
     MAIN
===================================== -->

<main class="history-page">


    <!-- HEADER -->

    <section class="history-header">

        <h1>
            Interview History
        </h1>

        <p>
            View and review your previous interview attempts.
        </p>

    </section>


    <!-- HISTORY -->

    <section class="history-container">


        <!-- FILTERS -->

        <div class="history-filters">

            <select id="history-category">

                <option value="all">
                    All Technologies
                </option>

                <option value="HTML">
                    HTML
                </option>

                <option value="CSS">
                    CSS
                </option>

                <option value="JavaScript">
                    JavaScript
                </option>

                <option value="Python">
                    Python
                </option>

                <option value="Java">
                    Java
                </option>

            </select>


            <select id="history-difficulty">

                <option value="all">
                    All Difficulties
                </option>

                <option value="Easy">
                    Easy
                </option>

                <option value="Medium">
                    Medium
                </option>

                <option value="Hard">
                    Hard
                </option>

            </select>

        </div>


        <!-- HISTORY LIST -->

        <div id="history-list">

            <div class="history-empty">

                <div class="history-empty-icon">
                    📚
                </div>

                <h3>
                    Loading interview history...
                </h3>

                <p>
                    Your previous interviews will appear here.
                </p>

            </div>

        </div>


    </section>

</main>


<!-- =====================================
     JAVASCRIPT
===================================== -->

<script src="js/navbar-profile-photo.js"></script>
<script src="js/interview-history.js"></script>



</body>

</html>
