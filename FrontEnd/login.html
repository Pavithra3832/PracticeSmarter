<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/login.css">

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login - PracticeSmarter</title>
</head>

<body>

    <div class="login-container">

        <div class="login-card">

            <!-- LEFT SIDE -->
             <div class="login-left">

    <h2>PracticeSmarter.</h2>

    <p>
        Practice your skills.<br>
        Build your confidence.<br>
        Crack your interview.
    </p>

    <div class="login-image">
        <img src="images/login-illustration.png"
             alt="Interview practice illustration">
    </div>

</div>

            <!-- RIGHT SIDE -->
            <div class="login-right">

                <h1>Welcome Back 👋 </h1>

                <p class="login-subtitle">
                    Login to continue your interview practice.
                </p>

                <form onsubmit="loginUser(event)">

                    <label>Email</label>
                    <input
                        type="email"
                        placeholder="Enter your email"
                        required
                    >

                    <label>Password</label>

<div class="password-box">
    <input
        type="password"
        id="password"
        placeholder="Enter your password"
        required
    >

    <button type="button" class="toggle-password" onclick="togglePassword()">
        👁
    </button>
</div>

<a href="#" class="forgot-password" onclick="forgotPassword(event)">
    Forgot Password?
</a>

                    <button type="submit">
                        Login
                    </button>

                </form>
                
                <button type="button" class="google-login" onclick="googleLogin()">
    <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg"
         alt="Google">
    Continue with Google
</button>
                

                <p class="signup-text">
                    Don't have an account?
                    <a href="signup.html">Sign Up</a>
                </p>

            </div>

        </div>

    </div>


<script type="module" src="js/login.js"></script>
</body>
</html>
